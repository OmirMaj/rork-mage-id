<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      MAGE ID web document template (wave 6b).

      The web app exports as a single-page app (app.json expo.web has no
      `output`), and in that mode Expo serves THIS file as the template for
      index.html (dev server and `expo export` alike) and ignores
      app/+html.tsx. It is Expo SDK 54's default template
      (@expo/cli/static/template/index.html) plus the two blocks marked
      below. Those blocks are verbatim copies of THEME_BOOT_SCRIPT and
      WEB_DOCUMENT_CSS in components/desktop/webDocument.ts; edit them there
      and paste here — scripts/validate-desktop-page-map.ts fails on any drift.
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- mage:theme-boot (components/desktop/webDocument.ts THEME_BOOT_SCRIPT) -->
    <script id="mage-theme-boot">
(function () {
  try {
    var p = window.localStorage.getItem('mageid_theme');
    var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
    </script>
    <!-- mage:document-css (components/desktop/webDocument.ts WEB_DOCUMENT_CSS) -->
    <style id="mage-document">
body { background-color: #151816; }
@media (prefers-color-scheme: light) { body { background-color: #ECEDE9; } }
html[data-theme='dark'] body { background-color: #151816; }
html[data-theme='light'] body { background-color: #ECEDE9; }
@media (prefers-reduced-motion: no-preference) {
  :where(a[href],[role='button'],[role='link'],[role='tab'],[role='menuitem']) * {
    transition-property: color, stroke, fill;
    transition-duration: 120ms;
    transition-timing-function: cubic-bezier(0.2,0,0,1);
  }
  :where(a[href],[role='button'],[role='link'],[role='tab'],[role='menuitem'],[role='checkbox'],[role='option'],[role='switch'],input,textarea) {
    transition-property: background-color, border-color, box-shadow, filter;
    transition-duration: 120ms;
    transition-timing-function: cubic-bezier(0.2,0,0,1);
  }
}
:is(a[href],[role='button'],[role='link'],[role='tab'],[role='menuitem'],[role='checkbox'],[role='switch']):focus-visible { outline: 2px solid #2F6B3A; outline-offset: 2px; }
html[data-theme='dark'] :is(a[href],[role='button'],[role='link'],[role='tab'],[role='menuitem'],[role='checkbox'],[role='switch']):focus-visible { outline-color: #5DB36E; }
@media print {
  html, body, #root {
    overflow: visible !important;
  }
  #root div {
    overflow: visible !important;
    max-height: none !important;
  }
  nav[aria-label='Primary navigation'],
  #mage-shell-dock,
  #mage-sync-pill,
  [data-testid='brain-fab'],
  [data-testid='help-fab'],
  [data-print='hide'] {
    display: none !important;
  }
  [data-print='fit'] {
    zoom: var(--mage-print-fit, 1);
  }
}
    </style>
    <!-- mage:prejs-level (SPLASHPX P2; checked by scripts/validate-level-splash.ts rule G
      and scripts/validate-level-desk.ts rules G + H)
      The still level the app's first web frame draws (BrandSplash, launchRect),
      shown while the bundle downloads instead of a blank page. Pure CSS, no
      animation. Every number is utils/levelTimeline.ts NATIVE_SPLASH_PX over the
      438 x 30 mark box at PNG x 293 / y 497. The width is TIERED: the phone cap
      min(42.77vmin, 240px) below 768 px, then three @media rules that mirror
      utils/levelDesk.ts DESK_SPLASH (tablet / laptop / monitor), so the large
      still shows before any JS. The colours are the WEB launch palette
      (utils/levelDesk.ts WEB_LAUNCH: the concrete ground, the brand green, the
      light ink; orchestrator decision 2026-10-01 — the web has no native splash
      to match, so it opens green). On a DARK page the colours are its dark twin
      (WEB_LAUNCH_DARK: Theme.dark.bg, the on-dark green, the dark ink) — the
      same resolution the app makes: the theme-boot data-theme tag above when it
      is set, else the OS prefers-color-scheme — so a dark-mode user never cuts
      from a light launch to the dark app. Those rules carry background-color
      only. It is a sibling AFTER #root and hides the moment React renders
      anything into #root, so #root stays exactly as Expo's template contract
      (and validate-desktop-page-map) needs it. -->
    <style id="mage-prejs-level-css">
#mage-prejs-level { position: fixed; inset: 0; background-color: #ECEDE9; z-index: 1; }
#root:not(:empty) + #mage-prejs-level { display: none; }
#mage-prejs-level .mpl-mark { position: absolute; left: 50%; top: 50%; width: min(42.7734375vmin, 240px); aspect-ratio: 438 / 30; transform: translate(-50%, -50%); }
#mage-prejs-level .mpl-part { position: absolute; }
#mage-prejs-level .mpl-cap-l { left: 0%; top: 0%; width: 1.826484%; height: 100%; background-color: #2B3038; opacity: 0.25098; border-radius: 9999px; }
#mage-prejs-level .mpl-cap-r { left: 98.173516%; top: 0%; width: 1.826484%; height: 100%; background-color: #2B3038; opacity: 0.25098; border-radius: 9999px; }
#mage-prejs-level .mpl-track { left: 1.826484%; top: 36.666667%; width: 96.347032%; height: 26.666667%; background-color: #2F6B3A; opacity: 0.25098; border-radius: 0; }
#mage-prejs-level .mpl-bubble { left: 42.465753%; top: 6.666667%; width: 15.296804%; height: 86.666667%; background-color: #2F6B3A; border-radius: 9999px; }
@media (min-width: 768px) { #mage-prejs-level .mpl-mark { width: clamp(240px, 30vw, 360px); } }
@media (min-width: 1280px) { #mage-prejs-level .mpl-mark { width: clamp(360px, 28vw, 480px); } }
@media (min-width: 1920px) { #mage-prejs-level .mpl-mark { width: clamp(480px, 25vw, 640px); } }
@media (prefers-color-scheme: dark) {
  html:not([data-theme='light']) #mage-prejs-level { background-color: #151816; }
  html:not([data-theme='light']) #mage-prejs-level .mpl-cap-l, html:not([data-theme='light']) #mage-prejs-level .mpl-cap-r { background-color: #F4EFE6; }
  html:not([data-theme='light']) #mage-prejs-level .mpl-track, html:not([data-theme='light']) #mage-prejs-level .mpl-bubble { background-color: #5DB36E; }
}
html[data-theme='dark'] #mage-prejs-level { background-color: #151816; }
html[data-theme='dark'] #mage-prejs-level .mpl-cap-l, html[data-theme='dark'] #mage-prejs-level .mpl-cap-r { background-color: #F4EFE6; }
html[data-theme='dark'] #mage-prejs-level .mpl-track, html[data-theme='dark'] #mage-prejs-level .mpl-bubble { background-color: #5DB36E; }
    </style>
    <noscript><style>#mage-prejs-level { display: none; }</style></noscript>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="mage-prejs-level" aria-hidden="true"><div class="mpl-mark"><div class="mpl-part mpl-cap-l"></div><div class="mpl-part mpl-cap-r"></div><div class="mpl-part mpl-track"></div><div class="mpl-part mpl-bubble"></div></div></div>
  </body>
</html>
