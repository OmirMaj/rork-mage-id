  <style>
    :root {
      --bg: #0B0D10;
      --bg-elev: #14171C;
      --fg: #F2F3F5;
      --fg-muted: #9BA3AD;
      --accent: #FF6A1A;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .code {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: clamp(96px, 18vw, 192px);
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--fg-muted);
      font-size: 1.0625rem;
      line-height: 1.5;
      max-width: 36rem;
      margin: 0 auto 2rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      background: var(--fg);
      color: var(--bg);
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
      border-radius: 999px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .cta:hover { transform: translateY(-1px); background: var(--accent); }
    .links {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      max-width: 36rem;
      width: 100%;
    }
    .links h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 1rem;
    }
    .links ul {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .links a {
      color: var(--fg);
      text-decoration: none;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9375rem;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .grain {
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 3px 3px;
      pointer-events: none;
      z-index: 1;
    }
    main { position: relative; z-index: 2; }
  </style>

</head>

  <div class="grain" aria-hidden="true"></div>
  <main>
    <div class="code">404</div>

    <p>The link you followed may be broken, or the page may have been moved. Head back to the home page or try one of the links below.</p>
    <a class="cta" href="/">Back to home →</a>

    <div class="links">
      <h2>Where to next?</h2>
      <ul>
