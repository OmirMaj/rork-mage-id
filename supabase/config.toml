# supabase/config.toml — per-function gateway settings for the MAGE ID project.
#
# WHY THIS FILE EXISTS (audit 2026-09-03: EDGE-F1 / EDGE-F2, OPS-F1 / OPS-F3).
#   `supabase functions deploy <name>` resets a function's verify_jwt to TRUE
#   unless the value is pinned here (or --no-verify-jwt is passed on every
#   single deploy). There was no config.toml, so redeploys silently flipped the
#   flag: morning-digest, invoice-dunning and qbo-reconciler were redeployed
#   verify_jwt=true in July 2026, the pg_cron jobs send only x-cron-secret (no
#   JWT), and the gateway answered 401 to every fire for ~6 weeks while
#   cron.job_run_details recorded "succeeded". No morning briefing, no overdue
#   reminder, no QuickBooks reconciliation — and the runbook's next deploy line
#   would have done the same to stripe-webhook, notify, mcp and the Friday
#   homeowner digest.
#
#   verify_jwt = false is NOT "no auth". Every function pinned false below
#   authenticates itself in code: the pg_cron shared secret (_shared/cronAuth.ts),
#   a Stripe / RevenueCat signature, the portal access token, an MCP personal
#   token, an HMAC-signed URL, or an explicit rate-limited public path.
#   scripts/validate-edge-verify-jwt.ts fails ship-check if a function directory
#   is missing here, if a self-authenticating or cron/trigger-targeted function
#   is pinned true, or if a verify_jwt = false function has no auth check in
#   its source.
#
# DEPLOY: `supabase functions deploy <name> --project-ref nteoqhcswappxxjlpvap`
#   The CLI reads this file. Do not pass --no-verify-jwt by hand any more, and
#   do not deploy from a checkout that lacks this file.

project_id = "nteoqhcswappxxjlpvap"

# ── verify_jwt = false — self-authenticating functions ─────────────────────

# pg_cron targets: x-cron-secret via _shared/cronAuth.ts (morning-digest,
# homeowner-weekly-digest and invoice-dunning ALSO accept a GoTrue-verified
# user JWT for their in-app preview / "send now" buttons).
[functions.coi-expiry-watch]
verify_jwt = false

