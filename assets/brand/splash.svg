<!--
  MAGE ID native splash — vector source of truth.

  The approved brand mark: an ink field with a thin amber spirit-level track
  and a bubble settled DEAD CENTRE — the exact motif from
  components/PersonaSwitchOverlay.tsx and the marketing site. Ink + amber
  only. No illustration, crest, gradient, glow, or emoji.

  This is the PRE-JS static layer used by app.json (splash-icon.png +
  adaptive-icon.png). The crisp Fraunces "MAGE ID" wordmark is drawn by the
  animated components/BrandSplash.tsx once JS boots.

  The shipped PNGs are generated by scripts/gen-splash.mjs (which draws this
  same geometry with jimp-compact, because the repo has no SVG rasteriser).
  If a rasteriser (rsvg-convert / resvg / sharp) is ever available, prefer
  regenerating the PNGs from THIS file so the vector stays authoritative:
    rsvg-convert -w 1024 -h 1024 assets/brand/splash.svg -o assets/images/splash-icon.png
    cp assets/images/splash-icon.png assets/images/adaptive-icon.png

  Tokens (constants/colors.ts Theme.dark): ink #0B0D10, amber #FF6A1A,
  cream #F4EFE6.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#0B0D10"/>
  <!-- Level track — thin amber-soft line the bubble rides. -->
  <rect x="297" y="508" width="430" height="8" rx="4" fill="#FF6A1A" fill-opacity="0.25"/>
  <!-- End notches + centre reference — muted cream hairlines. -->
  <rect x="293" y="497" width="8" height="30" rx="2" fill="#F4EFE6" fill-opacity="0.25"/>
  <rect x="723" y="497" width="8" height="30" rx="2" fill="#F4EFE6" fill-opacity="0.25"/>
  <rect x="510" y="501" width="4" height="22" rx="2" fill="#F4EFE6" fill-opacity="0.25"/>
  <!-- The bubble — settled dead centre. Full amber. -->
  <rect x="478" y="499" width="68" height="26" rx="13" fill="#FF6A1A"/>
</svg>
